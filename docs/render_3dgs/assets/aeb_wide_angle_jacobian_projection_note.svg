<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <rect width="1400" height="560" fill="#fbfaf5"/>
  <g fill="none" stroke="#d8d3c5" stroke-width="2">
    <line x1="40" y1="95" x2="1360" y2="95"/>
    <line x1="40" y1="190" x2="1360" y2="190"/>
    <line x1="40" y1="285" x2="1360" y2="285"/>
    <line x1="40" y1="380" x2="1360" y2="380"/>
    <line x1="40" y1="475" x2="1360" y2="475"/>
  </g>
  <g fill="#222" font-family="monospace" font-size="40">
    <text x="50" y="70">pinhole projection note</text>
  </g>
  <g fill="#111" font-family="monospace" font-size="30">
    <text x="60" y="165">[ fx   0   cx ] [ Xc ]</text>
    <text x="60" y="215">[  0  fy   cy ] [ Yc ]</text>
    <text x="60" y="265">[  0   0    1 ] [ Zc ]</text>
    <text x="430" y="215">=</text>
    <text x="490" y="165">[ fx*Xc + cx*Zc ]</text>
    <text x="490" y="215">[ fy*Yc + cy*Zc ]</text>
    <text x="490" y="265">[        Zc       ]</text>
    <text x="830" y="215">=</text>
    <text x="900" y="165">[ fx/Zc * Xc + cx ]</text>
    <text x="900" y="215">[ fy/Zc * Yc + cy ]</text>
    <text x="900" y="265">[        1        ]</text>
    <text x="150" y="410">u = fx/Zc * Xc + cx</text>
    <text x="150" y="485">v = fy/Zc * Yc + cy</text>
  </g>
  <g fill="none" stroke="#444" stroke-width="4">
    <path d="M45 125 L45 285"/>
    <path d="M365 125 L365 285"/>
    <path d="M475 125 L475 285"/>
    <path d="M795 125 L795 285"/>
    <path d="M880 125 L880 285"/>
    <path d="M1305 125 L1305 285"/>
  </g>
  <g fill="#555" font-family="monospace" font-size="24">
    <text x="520" y="355">divide by Zc after homogeneous projection</text>
    <text x="760" y="405">wide edge: x = Xc/Zc and y = Yc/Zc become large</text>
  </g>
</svg>
